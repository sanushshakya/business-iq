# Business IQ: API + Celery worker/beat + Postgres + Redis.
#
#   cp .env.example .env     # then set SECRET_KEY and DB_PASSWORD
#   docker compose up --build
#
# API:        http://localhost:8000 (set API_PORT in .env to change); docs at /api/docs/, admin at /admin/
# Create an admin user:  docker compose exec backend python manage.py createsuperuser
name: business-iq

x-app: &app
  build: .
  image: business-iq:latest
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment: &app-env
    # Values below override .env so the containers always talk to each other,
    # whatever DB_*/REDIS_* say for running outside Docker.
    DB_ENGINE: django.db.backends.postgresql
    DB_HOST: db
    DB_PORT: "5432"
    DB_NAME: ${DB_NAME:-iq_db}
    DB_USER: ${DB_USER:-iq_user}
    DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:-127.0.0.1,localhost}
    REDIS_HOST: redis
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/0
    USE_REDIS_CHANNELS: "True"
    USE_REDIS_CACHE: "True"
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-iq_db}
      POSTGRES_USER: ${DB_USER:-iq_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    <<: *app
    command: sh -c "python manage.py migrate --noinput && daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - media_data:/app/media
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  celery:
    <<: *app
    command: celery -A config worker --loglevel=info
    depends_on:
      backend:
        condition: service_healthy   # migrations have run

  celery-beat:
    <<: *app
    command: celery -A config beat --loglevel=info --schedule /tmp/celerybeat-schedule
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  media_data:
