name: CI

on:
  push:
    branches: [ '*' ]

jobs:
  build:

    runs-on: ubuntu-latest

    env:
      SECRET_KEY: ci-only-secret-key
      DEBUG: 'True'
      # Test against Postgres, as in production (the same suite also passes on SQLite)
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: iq_db
      DB_USER: iq_user
      DB_PASSWORD: ci-only-password
      DB_HOST: localhost
      DB_PORT: 5432

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: iq_db
          POSTGRES_USER: iq_user
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iq_user -d iq_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
    - uses: actions/checkout@v2

    - name: Set up Python 3.12
      uses: actions/setup-python@v2
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Run migrations
      run: python manage.py migrate

    - name: Run tests and coverage
      run: |
        pytest --cov=authentication --cov=common --cov-report term-missing --cov-fail-under=70

    - name: Run Ruff linting
      run: ruff check .