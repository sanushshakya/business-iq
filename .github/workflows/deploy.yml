name: Deploy

# Ships the app to AWS (G60): build the image, push it to ECR, run the migrations once, then roll every ECS service
# (web, worker, beat) onto it. If any service does not become healthy, every service goes back to what it ran before
# and the job fails. The steps are in scripts/deploy/ecs.sh (tested with a stand-in aws CLI); the runbook is the
# workspace's docs/runbooks/deploy.md. Undo a deploy with the Rollback workflow.
#
# Runs automatically after CI succeeds on main, or manually from the Actions tab (main only).
# Until AWS is configured (see "CI/CD" in README.md) the job skips itself with a warning instead of failing.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Never run two deployments (or a deployment and a rollback) at once, and never cancel one half way through.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # lets the job assume the AWS role with OIDC (no long-lived AWS keys)

jobs:
  deploy:
    name: Build, push to ECR, deploy to ECS
    # CI must have passed; a manual run is only allowed from main.
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    # Build (≤ 10 min) + migration (≤ 30 min, MIGRATION_TIMEOUT) + rollout and, if it fails, the revert (10 min each).
    timeout-minutes: 75
    environment: production

    steps:
      - uses: actions/checkout@v7
        with:
          # For workflow_run, deploy the exact commit CI tested rather than whatever main is now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Check deployment is configured
        id: config
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          AWS_ECR_REPOSITORY_URL: ${{ vars.AWS_ECR_REPOSITORY_URL || secrets.AWS_ECR_REPOSITORY_URL }}
          AWS_ECS_CLUSTER: ${{ vars.AWS_ECS_CLUSTER || secrets.AWS_ECS_CLUSTER }}
          AWS_ECS_SERVICES: ${{ vars.AWS_ECS_SERVICES || secrets.AWS_ECS_SERVICE }}
        run: |
          missing=""
          for name in AWS_REGION AWS_ROLE_ARN AWS_ECR_REPOSITORY_URL AWS_ECS_CLUSTER AWS_ECS_SERVICES; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Deployment skipped::AWS is not configured. Missing:$missing. See 'CI/CD' in README.md."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials
        if: steps.config.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: steps.config.outputs.configured == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      # ECR tags are immutable, so a re-run (or a redeploy of a commit already built) reuses the image.
      - name: Is the image already in ECR?
        id: image
        if: steps.config.outputs.configured == 'true'
        env:
          IMAGE_REPO: ${{ vars.AWS_ECR_REPOSITORY_URL || secrets.AWS_ECR_REPOSITORY_URL }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          if out=$(aws ecr describe-images --repository-name "${IMAGE_REPO#*/}" --image-ids "imageTag=$IMAGE_TAG" --output json 2>&1); then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image $IMAGE_TAG is already in ECR; not building it again."
          elif grep -q ImageNotFoundException <<< "$out"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error title=ECR check failed::$(tail -n 1 <<< "$out")"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v4
        if: steps.config.outputs.configured == 'true' && steps.image.outputs.exists == 'false'

      - name: Build and push image
        if: steps.config.outputs.configured == 'true' && steps.image.outputs.exists == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          provenance: false
          build-args: APP_VERSION=${{ github.event.workflow_run.head_sha || github.sha }}
          # Tagged with the commit so every deployment is traceable and rollbacks are exact.
          tags: ${{ vars.AWS_ECR_REPOSITORY_URL || secrets.AWS_ECR_REPOSITORY_URL }}:${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Registers a new task definition revision per service, runs `migrate` once as a one-off task on the first
      # service's (web) and stops before touching any service if it fails, then rolls every service with the ECS
      # circuit breaker on and checks each one's PRIMARY deployment is the new revision, COMPLETED.
      # Set the repository variable ECS_RUN_MIGRATIONS to 'false' to skip the migration task.
      - name: Migrate and roll out
        if: steps.config.outputs.configured == 'true'
        env:
          CLUSTER: ${{ vars.AWS_ECS_CLUSTER || secrets.AWS_ECS_CLUSTER }}
          SERVICES: ${{ vars.AWS_ECS_SERVICES || secrets.AWS_ECS_SERVICE }}
          IMAGE_REPO: ${{ vars.AWS_ECR_REPOSITORY_URL || secrets.AWS_ECR_REPOSITORY_URL }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
          APP_CONTAINER: ${{ vars.ECS_APP_CONTAINER }}
          RUN_MIGRATIONS: ${{ vars.ECS_RUN_MIGRATIONS != 'false' }}
        run: bash scripts/deploy/ecs.sh deploy
