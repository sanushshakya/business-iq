name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Python 3.12, Postgres 16)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SECRET_KEY: ci-only-secret-key-for-tests-0123456789-abcdef
      DEBUG: 'True'
      # Test against Postgres, as in production (the same suite also passes on SQLite)
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: iq_db
      DB_USER: iq_user
      DB_PASSWORD: ci-only-password
      DB_HOST: localhost
      DB_PORT: 5432

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: iq_db
          POSTGRES_USER: iq_user
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iq_user -d iq_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Run tests with coverage
        run: pytest --cov=authentication --cov=common --cov-report term-missing --cov-fail-under=70

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run Ruff
        run: ruff check .

  docker:
    name: Docker image and Compose file
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Builds exactly what deploy.yml ships, without pushing it.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: business-iq:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate docker-compose.yml
        env:
          SECRET_KEY: ci-only-secret-key-for-tests-0123456789-abcdef
          DB_PASSWORD: ci-only-password
        run: docker compose config --quiet

      - name: Smoke-test the image
        run: docker run --rm -e SECRET_KEY=ci-only-secret-key-for-tests-0123456789-abcdef business-iq:ci python manage.py check
